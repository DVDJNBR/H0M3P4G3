name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test Docker build
        run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # TEMPORARY diagnostic step -- the real deploy step below claims
      # success on every push, but /home/ubuntu/H0M3P4G3 doesn't exist when
      # checked directly on the VPS this domain's DNS points to. Confirming
      # what host/path this action actually reaches before trusting it
      # further. Remove once resolved.
      - name: Debug target host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: 5790
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "whoami: $(whoami)"
            echo "hostname: $(hostname)"
            echo "hostname -I: $(hostname -I)"
            echo "pwd: $(pwd)"
            echo "home listing:"
            ls -la /home/ubuntu/ 2>&1 || true
            echo "H0M3P4G3 check:"
            ls -la /home/ubuntu/H0M3P4G3 2>&1 || true

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: 5790
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/ubuntu/H0M3P4G3
            git pull origin main
            docker compose up --build -d
