name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test Docker build
        run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: 5790
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # .env on the VPS is managed by hand, not by this step. Every attempt
          # to have appleboy/ssh-action write it from GitHub Secrets (heredoc,
          # plain `echo >>`, with/without --force-recreate) silently no-opped
          # across ~10 real deploys -- .env's mtime never moved despite every
          # step reporting success. Root cause not found; GH Secrets for the 4
          # app vars still exist and are kept in sync manually with .env, but
          # nothing here writes them. To change a secret: edit .env directly
          # on the VPS, then `docker compose down && docker compose up -d`.
          script: |
            cd /home/ubuntu/H0M3P4G3
            git pull origin main
            docker compose up --build -d
