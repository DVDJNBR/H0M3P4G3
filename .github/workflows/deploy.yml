name: Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Test Docker build
        run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          port: 5790
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: PASSWORD_HASH,TOTP_SECRET,SESSION_SECRET,RAINDROP_TOKEN
          script: |
            cd /home/ubuntu/H0M3P4G3
            git pull origin main
            cat > .env <<H0M3P4G3_ENV_MARKER
            PASSWORD_HASH=$PASSWORD_HASH
            TOTP_SECRET=$TOTP_SECRET
            SESSION_SECRET=$SESSION_SECRET
            RAINDROP_TOKEN=$RAINDROP_TOKEN
            H0M3P4G3_ENV_MARKER
            echo "CHECKPOINT-1-env-written"
            docker compose up --build -d --force-recreate
            echo "CHECKPOINT-2-compose-up-done"
            docker inspect h0m3p4g3 --format '{{.State.StartedAt}}'
            docker compose exec -T app printenv RAINDROP_TOKEN | cut -c1-8
            docker compose exec -T app node -e 'fetch("https://api.raindrop.io/rest/v1/user",{headers:{Authorization:"Bearer "+process.env.RAINDROP_TOKEN}}).then(r=>console.log("status",r.status))'
            sleep 3
            docker compose logs app --tail 20
            echo "CHECKPOINT-3-end-diagnostic"
        env:
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
